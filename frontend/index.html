<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decentralized Icon Marketplace</title>
    <script type="module" src="/src/main.js"></script>
    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --success-bg: #dcfce7;
        --success-text: #166534;
        --error-bg: #fee2e2;
        --error-text: #991b1b;
        --warning-bg: #fef9c3;
        --warning-text: #854d0e;
        --radius-md: 8px;
        --radius-lg: 12px;
      }

      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.5;
      }

      body.no-scroll {
        overflow: hidden;
      }

      .container {
        max-width: 1100px;
        margin: 36px auto;
        padding: 0 20px;
      }

      .card-panel {
        background: var(--card-bg);
        padding: 28px;
        border-radius: var(--radius-lg);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid var(--border-color);
      }

      .header-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 16px;
        margin-bottom: 20px;
      }

      h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
      h3 { margin: 16px 0 12px 0; font-size: 1.05rem; font-weight: 600; }

      .form-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      input {
        padding: 9px 12px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        font-size: 0.92rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        flex: 1;
        min-width: 150px;
      }

      input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      button {
        padding: 9px 16px;
        border-radius: var(--radius-md);
        border: none;
        background-color: var(--primary-color);
        color: white;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s, opacity 0.2s;
        white-space: nowrap;
      }

      button:hover { background-color: var(--primary-hover); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      button.secondary {
        background-color: #f1f5f9;
        color: var(--text-main);
        border: 1px solid var(--border-color);
      }
      button.secondary:hover { background-color: #e2e8f0; }

      .wallet-status {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--text-muted);
        margin-right: 6px;
      }
      .status-dot.connected { background-color: #16a34a; }

      .muted { color: var(--text-muted); font-size: 0.875rem; }

      hr { border: 0; border-top: 1px solid var(--border-color); margin: 20px 0; }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 14px;
      }

      #status {
        margin-top: 12px;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        font-size: 0.92rem;
        display: none;
      }

      #status:not(:empty) { display: block; }
      #status.ok { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #bbf7d0; }
      #status.err { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }
      #status.muted { background-color: var(--warning-bg); color: var(--warning-text); border: 1px solid #fef08a; }

      #apiStatus {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        font-size: 0.9rem;
        display: none;
      }
      #apiStatus:not(:empty) { display: block; }
      #apiStatus.ok { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #bbf7d0; }
      #apiStatus.err { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }

      #txStatus {
        margin-top: 8px;
        padding: 10px 12px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        background: #f8fafc;
        font-size: 0.85rem;
        word-break: break-all;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .card {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 12px;
        background: #fff;
      }

      .state-card {
        border: 1px dashed var(--border-color);
        border-radius: 10px;
        padding: 16px;
        background: #f8fafc;
      }

      .state-title {
        font-size: 0.98rem;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .state-desc {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 10px;
      }

      .onboarding {
        border: 1px solid var(--border-color);
        background: #f8fafc;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 14px;
      }

      .onboarding-title {
        font-size: 0.9rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .onboarding-steps {
        display: grid;
        gap: 6px;
        margin-bottom: 10px;
      }

      .onboarding-step {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        font-size: 0.88rem;
      }

      .step-chip {
        border-radius: 999px;
        border: 1px solid var(--border-color);
        background: #fff;
        color: var(--text-muted);
        font-size: 0.72rem;
        padding: 2px 8px;
      }

      .step-chip.done {
        border-color: #86efac;
        background: #dcfce7;
        color: #166534;
      }

      .onboarding-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 40;
      }

      .modal-overlay.open {
        display: flex;
      }

      .modal-card {
        width: min(760px, 100%);
        background: #fff;
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 18px;
        box-shadow: 0 18px 48px rgba(15, 23, 42, 0.28);
      }

      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .modal-form {
        display: grid;
        gap: 14px;
      }

      .row-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .field {
        display: grid;
        gap: 6px;
      }

      .field label {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .section-box {
        border: 1px solid var(--border-color);
        border-radius: 10px;
        padding: 12px;
        background: #f8fafc;
        display: grid;
        gap: 8px;
      }

      .section-headline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.92rem;
        font-weight: 600;
      }

      .seg {
        display: inline-flex;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }

      .seg button {
        border-radius: 0;
        background: white;
        color: var(--text-main);
        border: 0;
        padding: 7px 12px;
      }

      .seg button.active {
        background: var(--primary-color);
        color: #fff;
      }

      .hidden {
        display: none !important;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
      }

      @media (max-width: 740px) {
        .row-2 {
          grid-template-columns: 1fr;
        }
      }

      a { color: #1d4ed8; text-decoration: underline; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card-panel">
        <div class="header-section">
          <h1>Decentralized Icon Marketplace</h1>
          <div class="wallet-status">
            <span class="muted">
              <span id="statusDot" class="status-dot"></span>
              <span id="wallet">Not connected</span>
            </span>
            <button id="switchNetworkBtn" class="secondary hidden">Switch to Localhost</button>
            <button id="disconnectBtn" class="secondary hidden">Disconnect</button>
            <button id="connectBtn">Connect MetaMask</button>
          </div>
        </div>

        <div class="form-group">
          <input id="contractAddress" placeholder="Contract address (0x...)" style="flex:2; min-width:300px;" required pattern="^0x[a-fA-F0-9]{40}$" />
          <button id="loadBtn" class="secondary">Load Contract</button>
          <button id="refreshBtn" class="secondary" disabled>Refresh Data</button>
        </div>

        <div id="onboarding" class="onboarding">
          <div class="onboarding-title">Quick Start</div>
          <div class="onboarding-steps">
            <div class="onboarding-step"><span>1) Connect wallet</span><span id="stepWallet" class="step-chip">Pending</span></div>
            <div class="onboarding-step"><span>2) Switch to Localhost 31337</span><span id="stepNetwork" class="step-chip">Pending</span></div>
            <div class="onboarding-step"><span>3) Load contract</span><span id="stepContract" class="step-chip">Pending</span></div>
          </div>
          <div class="onboarding-actions">
            <button id="onboardingPrimaryBtn">Connect Wallet</button>
            <button id="onboardingSecondaryBtn" class="secondary hidden">Open Add Icon Form</button>
          </div>
        </div>

        <div id="status" role="status" aria-live="polite"></div>
        <div id="apiStatus" role="status" aria-live="polite"></div>
        <div id="txStatus" class="muted" role="status" aria-live="polite">No transaction yet.</div>

        <hr />

        <div class="section-head">
          <h3 style="margin:0">Add New Icon (Seller)</h3>
          <button id="openAddModalBtn" disabled>Open Add Icon Form</button>
        </div>

        <hr />

        <div class="section-head">
          <h3 style="margin:0">Marketplace</h3>
        </div>
        <div id="icons" class="grid"></div>

        <hr />

        <div class="section-head">
          <h3 style="margin:0">My Purchases</h3>
          <span class="muted" id="purchaseCount">0 item(s)</span>
        </div>
        <div id="myPurchases" class="grid"></div>
      </div>
    </div>

    <div id="addIconModal" class="modal-overlay" aria-hidden="true">
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="addIconTitle">
        <div class="modal-head">
          <h3 id="addIconTitle" style="margin:0">Add New Icon</h3>
          <button id="closeAddModalBtn" class="secondary">Close</button>
        </div>
        <div id="addIconForm" class="modal-form">
          <div class="row-2">
            <div class="field">
              <label for="name">Icon Name</label>
              <input id="name" placeholder="e.g. Apple Icon Pack" required />
            </div>
            <div class="field">
              <label for="price">Price (ETH)</label>
              <input id="price" placeholder="0.05" type="number" step="0.0001" min="0" required />
            </div>
          </div>

          <div class="section-box">
            <div class="section-headline">
              <span>Preview Image</span>
              <div class="seg">
                <button type="button" id="previewModeUrlBtn" class="active">Use URL</button>
                <button type="button" id="previewModeFileBtn">Upload File</button>
              </div>
            </div>
            <input id="previewMode" type="hidden" value="url" />
            <input id="imageUrl" placeholder="https://... or ipfs://..." type="url" />
            <input id="imageFile" class="hidden" type="file" accept="image/png,image/jpeg,image/webp,image/gif" />
          </div>

          <div class="section-box">
            <div class="section-headline">
              <span>Download Asset</span>
              <div class="seg">
                <button type="button" id="assetModeUrlBtn" class="active">Use URL</button>
                <button type="button" id="assetModeFileBtn">Upload File</button>
              </div>
            </div>
            <input id="assetMode" type="hidden" value="url" />
            <input id="url" placeholder="https://... or ipfs://..." type="url" />
            <input id="assetFile" class="hidden" type="file" />
          </div>

          <div class="actions">
            <button id="addBtn">Add Icon</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
