<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decentralized Icon Marketplace</title>
    <script type="module" src="/src/main.js"></script>
    <style>
      :root {
        --primary-color: #2563eb;
        --primary-hover: #1d4ed8;
        --bg-color: #f8fafc;
        --card-bg: #ffffff;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #e2e8f0;
        --success-bg: #dcfce7;
        --success-text: #166534;
        --error-bg: #fee2e2;
        --error-text: #991b1b;
        --warning-bg: #fef9c3;
        --warning-text: #854d0e;
        --radius-md: 8px;
        --radius-lg: 12px;
      }

      body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        margin: 0;
        background-color: var(--bg-color);
        color: var(--text-main);
        line-height: 1.5;
      }

      .container {
        max-width: 1024px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .card-panel {
        background: var(--card-bg);
        padding: 32px;
        border-radius: var(--radius-lg);
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        border: 1px solid var(--border-color);
      }

      .header-section {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 20px;
        margin-bottom: 24px;
      }

      h1 { margin: 0; font-size: 1.5rem; font-weight: 600; }
      h3 { margin: 24px 0 16px 0; font-size: 1.125rem; font-weight: 500; }

      .form-group {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }

      input {
        padding: 10px 14px;
        border-radius: var(--radius-md);
        border: 1px solid var(--border-color);
        font-size: 0.95rem;
        transition: border-color 0.2s, box-shadow 0.2s;
        flex: 1;
        min-width: 150px;
      }

      input:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      input:invalid {
        border-color: var(--error-text);
      }

      button {
        padding: 10px 20px;
        border-radius: var(--radius-md);
        border: none;
        background-color: var(--primary-color);
        color: white;
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s, opacity 0.2s;
        white-space: nowrap;
      }

      button:hover { background-color: var(--primary-hover); }
      button:disabled { opacity: 0.6; cursor: not-allowed; }

      button.secondary {
        background-color: #f1f5f9;
        color: var(--text-main);
        border: 1px solid var(--border-color);
      }
      button.secondary:hover { background-color: #e2e8f0; }

      .wallet-status {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .status-dot {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background-color: var(--text-muted);
        margin-right: 6px;
      }

      .status-dot.connected { background-color: #16a34a; }

      .muted { color: var(--text-muted); font-size: 0.875rem; }

      hr { border: 0; border-top: 1px solid var(--border-color); margin: 32px 0; }

      #icons {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }

      /* Alert Box Styling */
      #status {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: var(--radius-md);
        font-size: 0.95rem;
        display: none; /* ซ่อนไว้จนกว่าจะมีข้อความ */
      }

      #status:not(:empty) { display: block; }
      #status.ok { background-color: var(--success-bg); color: var(--success-text); border: 1px solid #bbf7d0; }
      #status.err { background-color: var(--error-bg); color: var(--error-text); border: 1px solid #fecaca; }
      #status.muted { background-color: var(--warning-bg); color: var(--warning-text); border: 1px solid #fef08a; }

    </style>
  </head>
  <body>
    <div class="container">
      <div class="card-panel">
        <div class="header-section">
          <h1>Decentralized Icon Marketplace</h1>
          <div class="wallet-status">
            <span class="muted">
              <span id="statusDot" class="status-dot"></span>
              <span id="wallet">Not connected</span>
            </span>
            <button id="connectBtn">Connect MetaMask</button>
          </div>
        </div>

        <div class="form-group">
          <input id="contractAddress" placeholder="Contract address (0x...)" style="flex: 2; min-width: 300px;" required pattern="^0x[a-fA-F0-9]{40}$" title="Must be a valid Ethereum address" />
          <button id="loadBtn" class="secondary">Load Contract</button>
        </div>

        <hr />

        <h3>Add New Icon (Seller)</h3>
        <div class="form-group" id="addIconForm">
          <input id="name" placeholder="Icon name" required />
          <input id="price" placeholder="Price (ETH)" type="number" step="0.0001" min="0" required />
          <input id="url" placeholder="Download URL (IPFS/HTTPS)" type="url" style="flex: 2; min-width: 200px;" required />
          <button id="addBtn">Add Icon</button>
        </div>

        <hr />

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h3>Marketplace</h3>
          <button id="refreshBtn" class="secondary">Refresh Data</button>
        </div>

        <div id="status"></div>
        <div id="icons"></div>
      </div>
    </div>
  </body>
</html>
